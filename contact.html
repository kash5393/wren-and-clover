<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Wren &amp; Clover Botanicals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">Wren &amp; Clover</a>
    <nav class="site-nav" aria-label="Main">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="cart-link" href="#">Cart (0)</a>
  </div>
</header>

<main>
  <section class="section">
  <div class="container prose">
    <h1 class="page-title">Contact</h1>
    <p>Questions about an order or an ingredient? Send a message and we'll reply within two working days.</p>

    <form class="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="field">
        <label for="topic">Topic</label>
        <select id="topic" name="topic">
          <option>Question about a product</option>
          <option>Question about an order</option>
          <option>Wholesale enquiry</option>
          <option>Something else</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button class="button button-full" type="submit">Send message</button>
    </form>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <nav class="footer-nav" aria-label="Footer">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="shipping.html">Shipping and Returns</a>
    </nav>
    <p>&copy; Wren &amp; Clover Botanicals</p>
  </div>
</footer>
</body>
</html>
